[project]
name = "avito-firewall-flow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.15.0",
    "openpyxl>=3.1.5",
    "questionary>=2.1.1",
]

[project.optional-dependencies]
# GeeTest solver: avito.py solves captchas with it (`uv sync --extra captcha`);
# without it a captcha only replaces the session, which rarely helps.
captcha = [
    "ddddocr @ git+https://github.com/sml2h3/ddddocr.git@main",
    "numpy>=2.2.1",
    "opencv-python-headless>=4.10.0.84",
    "pycryptodome>=3.21.0",
    "requests>=2.32.3",
]

[tool.uv]
package = false
